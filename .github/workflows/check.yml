name: Check Inventory Manager changes

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Check Python syntax
        run: python -m compileall -q app tests
      - name: Subject identity test
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set +e
          pytest -q tests/test_shared_auth.py::test_oidc_subject_becomes_permanent_identity > /tmp/auth-test.log 2>&1
          code=$?
          if [ "$code" -ne 0 ]; then
            printf 'Temporary CI diagnostic for subject identity test:\n\n```text\n' >/tmp/comment.txt
            cat /tmp/auth-test.log >>/tmp/comment.txt
            printf '\n```\n' >>/tmp/comment.txt
            gh pr comment "${{ github.event.pull_request.number }}" --body-file /tmp/comment.txt
          fi
          cat /tmp/auth-test.log
          exit "$code"
      - name: Tenant isolation test
        run: pytest -q tests/test_shared_auth.py::test_auto_provisioned_accounts_have_isolated_storage
      - name: No local OIDC password test
        run: pytest -q tests/test_shared_auth.py::test_oidc_only_account_does_not_store_a_password
      - name: Duplicate subject test
        run: pytest -q tests/test_shared_auth.py::test_duplicate_subject_cannot_map_to_two_tenants
      - name: Fail-closed config test
        run: pytest -q tests/test_shared_auth.py::test_auth_enabled_with_missing_oidc_config_is_detected
      - name: Popup continuity test
        run: pytest -q tests/test_shared_auth.py::test_popup_login_keeps_main_page_available
      - name: Validate Compose
        run: docker compose config >/dev/null
